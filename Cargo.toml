[package]
name = "sealed_coffin"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Sealed Coffin: a sealed-bid auction on the Tari Ootle with stealth deposits, stealth refunds and one-time bidder keys."

[dependencies]
tari_template_lib = "0.34.0"
minicbor = { version = "2.3", default-features = false, features = ["derive", "alloc"] }

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = 0

# End-to-end tests on the real Ootle engine. Build from the committed Cargo.lock (--locked):
# tari_engine 0.45.0 does not compile against tari_template_lib_types 0.34.1, so the lock pins 0.34.0.
[dev-dependencies]
tari_template_test_tooling = "0.45"
tari_template_lib_types = "0.34.0"
tari_ootle_common_types = "0.45"
sha2 = "0.10"
tari_bor = "0.16"
